<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOZO</title>
<meta name="description" content="BOZO: group parlays, one leg each."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="BOZO"><meta name="theme-color" content="#ffffff"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest">
<style>/* BOZO demo · lo-fi but tidy. One neutral palette, one dark accent, yellow = needs attention, green = done. */
:root{
  --bg:#e9e9e4; --card:#fff; --ink:#1f221d; --muted:#6b6f66; --line:#dcddd6; --soft:#f5f5f1; --soft2:#efefea;
  --primary:#24302a; --primary-ink:#fff;
  --good:#2e6b45; --good-bg:#e5f1e8; --warn:#8a6418; --warn-bg:#fcf2dc; --warn-line:#e6c47c; --bad:#9c3d33; --bad-bg:#fbe9e6;
  --radius:14px; color-scheme:light;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:3px solid #7d9a86;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}

/* ---------- desktop stage */
.topnav{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 22px;background:#f7f7f3;border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:3px;font-size:14px}
.brand small{font-weight:600;letter-spacing:.5px;color:var(--muted);margin-left:8px;font-size:12px}
.seg{display:flex;border:1px solid #cfd1c8;border-radius:10px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:#fff;min-height:36px;padding:0 14px;font-weight:600;font-size:13px;border-right:1px solid #e3e4dc;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--primary);color:#fff}
.topnav .spacer{flex:1}
.meter{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.meter b{color:var(--ink)}
.stage{display:flex;gap:36px;justify-content:center;align-items:flex-start;padding:28px 22px 60px}
.panel{width:320px;flex:0 0 320px;display:flex;flex-direction:column;gap:14px;position:sticky;top:80px}
.pbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.pbox h3{margin:0 0 4px;font-size:12px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase}
.pbox p{margin:6px 0 0;font-size:13px;line-height:1.45;color:#40443c}
.pbox .code{display:inline-block;font-weight:700;font-size:12px;background:var(--soft2);border-radius:6px;padding:2px 6px;margin-right:6px;color:var(--ink)}
.pbox .now{font-size:15px;font-weight:700;margin-top:4px}
.mlist{display:flex;flex-direction:column;gap:4px;margin-top:8px;max-height:330px;overflow:auto}
.mlist button{text-align:left;border:1px solid transparent;background:var(--soft);border-radius:9px;padding:8px 10px;font-size:13px;line-height:1.3}
.mlist button:hover{border-color:var(--line);background:#fff}
.mlist button small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.mlist .tag{font-size:10.5px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin-right:4px}
.prow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600}
.pbtn:hover{background:var(--soft)}
@media (max-width:900px){.stage{flex-direction:column;align-items:center;padding:0 0 40px}.panel{position:static;width:100%;max-width:430px;flex:auto;padding:0 12px}}

/* ---------- phone */
.phone{width:390px;height:812px;background:var(--card);border:1px solid #cfd0c8;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 18px 40px #262a2014,0 2px 6px #262a2010;position:relative;flex:0 0 auto}
@media (max-width:480px){.phone{width:100vw;height:100dvh;border-radius:0;border:0}}
.sbar{height:44px;flex:0 0 44px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px;font-size:13px;font-weight:700}
.sbar .dots{letter-spacing:2px;color:var(--muted);font-size:11px}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.scroll{flex:1;overflow:auto;min-height:0}
.tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding:6px 10px 20px;background:#fff}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;position:relative}
.tabbar button[aria-current=page]{color:var(--ink)}
.tabbar .bang{position:absolute;top:1px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:#d9a227;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}

/* ---------- shell header */
.rhead{padding:6px 18px 12px;border-bottom:1px solid var(--line);background:#fff}
.rhead .grp{display:flex;align-items:center;justify-content:space-between}
.grpbtn{border:0;background:none;padding:4px 0;font-weight:800;font-size:13px;letter-spacing:1.6px;text-transform:uppercase;display:flex;align-items:center;gap:4px}
.ticons{display:flex;gap:2px}
.icon-btn{border:0;background:none;padding:6px;border-radius:8px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--soft)}
.ttabs{display:flex;gap:6px;margin-top:8px;overflow:auto}
.ttab{border:1px solid var(--line);background:var(--soft);border-radius:18px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.ttab[aria-current=true]{background:var(--primary);border-color:var(--primary);color:#fff}
.ttab.add{background:#fff;color:var(--muted)}
.tname{font-size:24px;font-weight:800;letter-spacing:-.6px;margin:10px 0 2px}
.tmeta{font-size:13px;color:var(--muted)}
.tmeta b{color:var(--ink)}

.section{padding:14px 18px 4px}
.section h4{margin:0 0 8px;font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.section h4 button{border:0;background:none;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:#4f5a4c;text-decoration:underline;text-underline-offset:3px}

/* status line + progress */
.statusline{display:flex;align-items:center;gap:10px;margin-top:10px}
.prog{flex:1;height:6px;background:var(--soft2);border-radius:4px;overflow:hidden;display:flex;gap:2px}
.prog i{flex:1;background:#dedfd8}
.prog i.g{background:var(--good)} .prog i.y{background:#e2b54d}
.statusline span{font-size:13px;font-weight:700;white-space:nowrap}
.waiting{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
.due{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;background:var(--soft);border-radius:10px;padding:8px 12px;font-size:13px}
.due b{font-size:14px}
.due .cd{font-weight:800;font-variant-numeric:tabular-nums}
.due.late{background:var(--warn-bg);color:#6c4e12}

/* needs-you cards */
.need{border:1.5px solid var(--warn-line);background:var(--warn-bg);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.need.info{border-color:var(--line);background:var(--soft)}
.need.good{border-color:#b9d8c3;background:var(--good-bg)}
.need .nt{font-size:14px;font-weight:700;color:#5d4410}
.need.info .nt{color:var(--ink)} .need.good .nt{color:var(--good)}
.need p{margin:3px 0 0;font-size:13px;color:#6c5a33;line-height:1.4}
.need.info p{color:var(--muted)}
.need .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.nb{border:1px solid #d9cfb5;background:#fff;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700}
.nb.p{background:var(--primary);border-color:var(--primary);color:#fff}
.nb:hover{filter:brightness(.97)}
.split{display:inline-flex}
.split .nb:first-child{border-radius:9px 0 0 9px}
.split .nb:last-child{border-radius:0 9px 9px 0;border-left:1px solid #ffffff55;padding:8px 9px}
.capline{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:2px 0 8px;display:flex;align-items:center;gap:6px}
.capbadge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;background:var(--primary);color:#fff;border-radius:5px;padding:2px 6px}

/* rider cards */
.rcard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;position:relative}
.rcard.me{border-color:#b8bdb2;box-shadow:0 1px 0 #0000000a}
.rcard.green{border-left:5px solid var(--good);padding-left:10px}
.rcard.yellow{border-left:5px solid #e2b54d;padding-left:10px}
.rcard.empty{border-style:dashed}
.rtop{display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;background:var(--soft2);display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 30px}
.rname{font-weight:700;font-size:15px;flex:1;display:flex;align-items:center;gap:6px}
.lights{display:flex;gap:5px}
.lt{font-size:11px;font-weight:700;border-radius:20px;padding:3px 8px;background:var(--soft2);color:var(--muted);white-space:nowrap}
.lt.g{background:var(--good-bg);color:var(--good)} .lt.y{background:var(--warn-bg);color:var(--warn)}
.rleg{margin-top:8px}
.rleg .w{font-size:12.5px;color:var(--muted)}
.rleg .b{font-size:16px;font-weight:700;letter-spacing:-.2px;margin-top:1px;display:flex;justify-content:space-between;gap:8px}
.rleg .b .o{white-space:nowrap}
.rnote{font-size:12.5px;margin-top:7px;padding:6px 9px;border-radius:8px;background:var(--warn-bg);color:#6c4e12;font-weight:600}
.rnote.gray{background:var(--soft);color:var(--muted);font-weight:500}
.chk{margin-top:8px;border-top:1px solid var(--soft2);padding-top:7px;font-size:12.5px}
.chk summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
.chk summary::-webkit-details-marker{display:none}
.chk.ok summary{color:var(--good)} .chk.bad summary{color:var(--warn)}
.chk ul{list-style:none;margin:6px 0 0;padding:0}
.chk li{display:flex;gap:7px;padding:3px 0;color:#41463d;line-height:1.35}
.chk li i{font-style:normal;width:16px;flex:0 0 16px;text-align:center;font-weight:800}
.chk li.ok i{color:var(--good)} .chk li.no i{color:var(--warn)} .chk li.na i{color:var(--muted)}
.chk .fin{color:var(--muted);margin-top:4px;font-size:12px}
.reacts{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.reacts span{font-size:12px;background:var(--soft);border-radius:12px;padding:2px 7px}
.rmenu{position:absolute;top:8px;right:8px}
.cardbtns{display:flex;gap:8px;margin-top:10px}
.cardbtns .nb{flex:1;text-align:center}

/* generic */
.body{padding:20px 22px 28px;flex:1;display:flex;flex-direction:column;overflow:auto}
.head{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:4px 14px 12px;border-bottom:1px solid var(--line)}
.head .t{text-align:center}
.head small{display:block;font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:4px}
.head b{font-size:17px}
h1{font-size:28px;line-height:1.1;letter-spacing:-.8px;margin:0 0 10px}
h2{font-size:21px;line-height:1.2;letter-spacing:-.4px;margin:0 0 8px}
.lead{font-size:15px;color:var(--muted);margin:0 0 18px;line-height:1.45}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px;padding:11px 16px}
.btn:hover:not(:disabled){background:var(--soft)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover:not(:disabled){background:#33433a}
.btn + .btn{margin-top:10px}
.link{background:none;border:0;padding:8px 0;color:#4f5a4c;text-decoration:underline;text-underline-offset:4px;font-size:14px;align-self:center}
.link.tiny{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1}

/* pick module (C screens) */
.path{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.drop{border:1.5px dashed #c5c7bd;border-radius:16px;background:#f8f8f5;padding:22px 20px;text-align:center;margin-bottom:12px}
.drop.over{border-color:var(--primary);background:#eef2ec}
.drop b{display:block;font-size:16px;margin:12px 0 6px}
.drop p{margin:0 0 16px;color:var(--muted);font-size:13.5px}
.preview{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.preview img{width:64px;height:86px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line)}
.bar{height:6px;background:#e5e6df;border-radius:4px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--primary);transition:width .2s}
.leg{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 15px;margin-bottom:10px}
.leg:hover{background:var(--soft)}
.leg .what b{font-size:15px}
.leg .ms{font-size:17px;font-weight:700;margin-top:2px}
.leg .meta{font-size:12px;color:var(--muted);margin-top:6px}
.flag{display:inline-block;font-size:11px;font-weight:600;border-radius:5px;padding:3px 6px;margin:6px 6px 0 0}
.flag.warn{background:var(--warn-bg);color:var(--warn)} .flag.good{background:var(--good-bg);color:var(--good)} .flag.bad{background:var(--bad-bg);color:var(--bad)}
.flag.neutral{background:#eeefea;color:var(--muted)}
form .f,.f{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;min-height:44px;border:1px solid #cfd1c8;border-radius:10px;padding:10px 12px;background:#fff;font-size:15px}
textarea{min-height:80px;resize:vertical}
.f.unsure input,.f.unsure select{border-color:#d8a64a;background:#fffaf0}
.f .hint{font-size:12px;color:var(--muted);margin-top:5px}
.f.unsure .hint{color:var(--warn);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banner{border-radius:12px;padding:13px 15px;margin-bottom:14px}
.banner b{display:block;font-size:15px;margin-bottom:3px}
.banner p{margin:0;font-size:13.5px;line-height:1.4}
.banner.good{background:var(--good-bg);color:#234f35} .banner.warn{background:var(--warn-bg);color:#6c4e12} .banner.bad{background:var(--bad-bg);color:#7c2f27} .banner.neutral{background:var(--soft);color:var(--ink)}
.pick{border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:14px}
.pick .who{font-size:12.5px;color:var(--muted)}
.pick .sel{font-size:19px;font-weight:700;margin:4px 0;letter-spacing:-.3px}
.pick .bet{font-size:15px;color:#3d4339;margin-top:2px}
.pick .odds{font-size:26px;font-weight:700;letter-spacing:-.6px;margin-top:8px}
.pick .src{font-size:12px;color:var(--muted);margin-top:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.opt[aria-pressed=true]{border:2px solid var(--primary);padding:11px 13px;background:#f1f4f0}
.opt .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid #9aa196;flex-shrink:0;display:grid;place-items:center;font-size:11px;color:#fff}
.opt[aria-pressed=true] .dot{background:var(--primary);border-color:var(--primary)}
.opt .l{flex:1} .opt .l b{font-size:15px} .opt .l small{display:block;font-size:12px;color:var(--muted)}
.opt .p{font-weight:700;font-size:15px}
.item{display:flex;gap:12px;align-items:center;border:1.5px solid var(--warn-line);background:var(--warn-bg);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.item > div{flex:1} .item b{font-size:14px;color:#6c4e12} .item p{margin:3px 0 0;font-size:13px;color:#6c5a33}
.item.ok{border-color:#b9d8c3;background:var(--good-bg)} .item.ok b{color:var(--good)} .item.ok p{color:#3f6a4e}
.btn.small-btn{width:auto;min-height:38px;font-size:13px;padding:8px 12px;flex:0 0 auto;background:#fff}
details.raw{margin-top:14px;font-size:13px;color:var(--muted)}
details.raw pre{white-space:pre-wrap;background:var(--soft);padding:10px;border-radius:8px;font-size:12px;max-height:200px;overflow:auto}
.examples{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px}
.examples button{border:1px solid var(--line);background:var(--soft);border-radius:16px;padding:6px 10px;font-size:12.5px}
.spin{width:22px;height:22px;border:3px solid #dfe0d8;border-top-color:var(--primary);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
#pick-root{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#pick-root .body{overflow:auto}

/* sheets (inside the phone) */
.sheet-bg{position:absolute;inset:0;background:#1d201b59;z-index:10;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:16px 22px 26px;max-height:90%;overflow:auto}
.sheet .grab{width:40px;height:4px;background:#cfd1c8;border-radius:3px;margin:0 auto 14px}
.sheet h2{margin-bottom:6px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--soft2);font-size:14px}
.kv span{color:var(--muted)} .kv b{text-align:right}
.handle{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;width:100%;background:#fff;text-align:left;text-decoration:none;color:inherit}
.handle b{display:block;font-size:15px} .handle small{color:var(--muted);font-size:12.5px}
.handle .go{margin-left:auto;font-size:13px;font-weight:700}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--soft2)}
.toggle b{font-size:14px;display:block} .toggle small{font-size:12px;color:var(--muted)}
.sw{width:46px;height:28px;border-radius:15px;background:#d5d6cf;border:0;position:relative;flex:0 0 46px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px #0003}
.sw[aria-checked=true]{background:var(--good)} .sw[aria-checked=true]::after{left:21px}
.range{padding:4px 0 10px}
.range .vals{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:6px}
.range input[type=range]{min-height:0;padding:0;border:0;height:24px}
.who-in{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.who-in label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:600;margin:0}
.who-in input{width:auto;min-height:0}
.menu{position:absolute;right:12px;top:40px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #0002;z-index:6;min-width:210px;overflow:hidden}
.menu button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:11px 14px;font-size:14px;border-bottom:1px solid var(--soft2)}
.menu button:hover{background:var(--soft)}
.menu button small{display:block;color:var(--muted);font-size:12px}

/* chat */
.chat{display:flex;flex-direction:column;flex:1;min-height:0}
.pins{padding:10px 14px 2px;border-bottom:1px solid var(--line);background:#fbfbf8;max-height:46%;overflow:auto}
.pins .capline{margin:0 0 6px}
.msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sys{align-self:center;font-size:12px;color:var(--muted);background:var(--soft);border-radius:12px;padding:4px 10px;text-align:center;max-width:90%}
.msg{max-width:78%;align-self:flex-start;position:relative}
.msg.mine{align-self:flex-end}
.msg .from{font-size:11.5px;color:var(--muted);margin:0 0 2px 10px}
.msg .bub{background:var(--soft2);border-radius:16px;padding:8px 12px;font-size:14.5px;line-height:1.35;border:0;text-align:left;width:100%}
.msg.mine .bub{background:var(--primary);color:#fff}
.msg .bub img{max-width:100%;border-radius:10px;display:block}
.msg .rx{display:flex;gap:3px;margin-top:2px;justify-content:flex-end}
.msg .rx span{font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 6px}
.rxbar{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 6px;box-shadow:0 4px 12px #0002;margin-top:4px;width:max-content}
.rxbar button{border:0;background:none;font-size:18px;padding:2px 4px}
.compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fff;align-items:center}
.compose input{border-radius:20px;min-height:40px}
.compose .icon-btn{flex:0 0 auto}

/* toast + misc */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#24271f;color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;max-width:90vw;z-index:60;box-shadow:0 6px 20px #0003}
.empty-state{text-align:center;color:var(--muted);font-size:14px;padding:30px 10px}
.done-mark{width:54px;height:54px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center;margin:4px 0 14px}
.soon{font-size:11px;font-weight:700;background:var(--soft2);color:var(--muted);border-radius:5px;padding:2px 6px;margin-left:6px}

/* ---------- map */
.mapwrap{padding:18px 22px 60px}
.maphead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.maphead h2{margin:0;font-size:20px}
.maphead p{margin:0;color:var(--muted);font-size:13px;flex-basis:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid #8b9187;vertical-align:middle;margin-right:5px}
.legend i.cap{border-color:#24302a;border-top-width:3px} .legend i.rid{border-color:#c48a12;border-top-width:3px}
.canvas{position:relative;overflow:auto;background:#f3f3ef;border:1px solid var(--line);border-radius:16px;height:calc(100vh - 170px);min-height:520px}
.board{position:relative;transform-origin:0 0;padding:24px}
.lane{display:flex;gap:56px;align-items:flex-start;margin-bottom:44px;position:relative}
.lanelabel{position:absolute;left:0;top:-20px;font-size:11.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.lanes{position:relative;padding-top:20px}
.thumb{width:196px;flex:0 0 196px;border:0;background:none;padding:0;text-align:left;position:relative;cursor:pointer}
.thumb .frame{width:196px;height:392px;border-radius:22px;border:1px solid #cfd0c8;background:#fff;overflow:hidden;position:relative;box-shadow:0 4px 12px #0000000d}
.thumb .inner{width:390px;height:780px;transform:scale(.5025);transform-origin:0 0;pointer-events:none;display:flex;flex-direction:column}
.thumb .cap{margin-top:8px;font-size:12.5px;line-height:1.3}
.thumb .cap b{display:block;font-size:13px}
.thumb .cap span{color:var(--muted)}
.thumb .num{position:absolute;top:-10px;left:-10px;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #8b9187;font-size:12px;font-weight:800;display:none;place-items:center;z-index:3}
.board.path-captain .thumb.on-captain .num,.board.path-rider .thumb.on-rider .num{display:grid}
.board.path-captain .thumb.on-captain .num{border-color:#24302a}
.board.path-rider .thumb.on-rider .num{border-color:#c48a12}
.board.path-captain .thumb:not(.on-captain),.board.path-rider .thumb:not(.on-rider){opacity:.35}
.thumb:hover .frame{border-color:#8b9187}
.thumb.later .frame{border-style:dashed;background:#fafaf7;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;padding:20px}
svg.arrows{position:absolute;inset:0;pointer-events:none;overflow:visible}
svg.arrows path{fill:none;stroke:#9a9f95;stroke-width:1.6}
svg.arrows text{font-size:11px;fill:#6b6f66}
.board.path-captain svg.arrows path:not(.cap),.board.path-rider svg.arrows path:not(.rid){opacity:.15}
.board.path-captain svg.arrows path.cap{stroke:#24302a;stroke-width:2.4}
.board.path-rider svg.arrows path.rid{stroke:#c48a12;stroke-width:2.4}
.zoom{display:flex;gap:4px}
.thumb .cap .goes{display:block;color:#4f5a4c;font-size:11.5px;margin-top:3px}

/* ---------- Drop 1.1 */
.setbtn{display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 8px}
.lt.h{background:#fde7c2;color:#8a5a00}
.rcard.nothing{border:2px dashed #e0a43a;background:#fffaf0}
.rcard.nothing .rname{color:#5d4410}
.rnote.hot{background:#fde7c2;color:#7a4d00;font-weight:700}
.rtop .chev{font-size:22px;color:var(--muted);margin-left:2px;line-height:1}
.manage{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.nb.sm{padding:5px 10px;font-size:12px}
.prog i.h{background:#e0a43a;opacity:.55}
/* the official ticket */
.ticket{border:1px solid #c9cdc3;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 2px 0 #0000000a}
.ticket .th{background:var(--primary);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase}
.ticket.full .th{background:var(--good)}
.trow{display:flex;gap:10px;padding:11px 14px;border:0;border-bottom:1px solid var(--soft2);align-items:center;width:100%;background:#fff;text-align:left}
.trow:hover{background:#fafaf7}
.trow .ck{width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 22px}
.trow .tw{flex:1;min-width:0}
.trow .tw small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tw b{font-size:14.5px;display:block;margin-top:1px}
.trow .to{font-weight:800;font-size:15px;text-align:right}
.trow .to small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.tempty{padding:16px 14px;color:var(--muted);font-size:13px}
.tslots{display:flex;align-items:center;gap:5px;padding:10px 14px;font-size:12px;color:var(--muted)}
.tslots i{width:22px;height:22px;border-radius:50%;border:1.5px dashed #c5c7bd}
.tslots span{margin-left:4px}
.ticket .perf{border-top:2px dashed #d8dad2;margin:0 10px}
.ticket .tf{padding:9px 14px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
/* forms */
.money{display:flex;align-items:center;border:1px solid #cfd1c8;border-radius:10px;background:#fff;padding-left:12px}
.money span{font-weight:700;color:var(--muted)}
.money input{border:0;padding-left:6px;min-height:42px}
.range .vals{display:flex;justify-content:space-between;font-weight:800;font-size:16px;margin-bottom:8px}
.range .vals small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px}
.range .vals span:last-child{text-align:right}
.dual{position:relative;height:30px}
.dual .track{position:absolute;left:0;right:0;top:13px;height:5px;border-radius:3px;background:#dedfd8}
.dual .track i{position:absolute;top:0;bottom:0;background:var(--primary);border-radius:3px}
.dual input[type=range]{position:absolute;left:0;top:0;width:100%;height:30px;margin:0;padding:0;border:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none;min-height:0}
.dual input[type=range]::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--primary);box-shadow:0 1px 3px #0003;cursor:grab}
.dual input[type=range]::-moz-range-thumb{pointer-events:auto;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--primary);cursor:grab}
.dual input[type=range]::-webkit-slider-runnable-track{background:none}
.subh{margin:18px 0 8px;font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.minis{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.mini{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 10px;text-align:left;width:100%}
.mini.green{border-left:4px solid var(--good)} .mini.yellow{border-left:4px solid #e2b54d}
.mini span:nth-child(2){flex:1} .mini b{display:block;font-size:14px} .mini small{color:var(--muted);font-size:12px}
.mini .chev{font-size:20px;color:var(--muted)}
details.more{margin-top:10px}
details.more summary{cursor:pointer;font-size:13px;color:var(--muted);padding:6px 0}
.btn.danger{color:var(--bad);border-color:#efc9c3}
details.pins summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;padding:2px 0 8px}
details.pins summary::-webkit-details-marker{display:none}
details.pins:not([open]) .pinchev{transform:rotate(-90deg)}
details.pins:not([open]){padding-bottom:4px}
.recent{margin-top:20px}
.recent h3{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.recent .leg:disabled{opacity:.5}
.mlist button[aria-current=true]{border-color:var(--primary);background:#fff;box-shadow:inset 3px 0 0 var(--primary)}

/* ---------- Drop 1.2 */
.tprog{padding:10px 14px 9px;border-bottom:1px solid var(--soft2)}
.segbar{display:flex;gap:3px}
.pseg{flex:1;min-width:0;text-align:center}
.pseg i{display:block;height:8px;border-radius:4px;background:#dedfd8;box-sizing:border-box}
.pseg.green i{background:var(--good)} .pseg.yellow i{background:#e2b54d} .pseg.nothing i{background:#fff;border:1.5px dashed #e0a43a}
.pseg b{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.seglegend{display:flex;gap:12px;font-size:10.5px;color:var(--muted);margin-top:6px}
.seglegend i{display:inline-block;width:12px;height:6px;border-radius:3px;margin-right:4px;vertical-align:middle;box-sizing:border-box}
.seglegend i.green{background:var(--good)} .seglegend i.yellow{background:#e2b54d} .seglegend i.nothing{border:1.5px dashed #e0a43a}
.tdue{font-size:12px;color:var(--muted);margin-top:8px} .tdue b{color:var(--ink)}
.trow em{display:block;font-style:normal;font-size:11.5px;margin-top:3px;font-weight:600}
.trow em.risk{color:#8a5a00} .trow em.okn{color:var(--good)}
.av{background-position:center;background-size:cover}
.av.ring-yellow{box-shadow:0 0 0 2px #fff,0 0 0 4px #e2b54d}
.av.ring-nothing{outline:2px dashed #e0a43a;outline-offset:2px}
.tslots .av{margin-right:4px}
.need.deadline{border-color:#e0a43a;background:#fff4dd}
.needbody{display:block;width:100%;text-align:left;border:0;background:none;padding:0}
.needbody .nt{display:block}
.needbody .nbet{display:block;font-size:14.5px;font-weight:600;color:#3d3420;margin:5px 0 3px}
.nudgeinfo{font-size:12.5px;color:var(--muted);margin:6px 0 6px;text-align:center}
details.pins.urgent summary{background:#fde7c2;border-radius:10px;padding:8px 10px;color:#7a4d00;margin-bottom:8px}
.bangdot{width:18px;height:18px;border-radius:50%;background:#d9a227;color:#fff;display:inline-grid;place-items:center;font-size:12px;font-weight:800;margin-right:4px}
.tabbar button{position:relative}
.dotlive{position:absolute;top:4px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--good)}
.mecard{display:flex;gap:14px;align-items:flex-start}
.mecard input{min-height:40px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.stats div{background:var(--soft);border-radius:10px;padding:10px 12px}
.stats b{display:block;font-size:17px} .stats small{color:var(--muted);font-size:12px}
.stats .wide{grid-column:1/-1} .stats .wide b{font-size:14px}
.pastrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--soft2)}
.pst{font-size:10.5px;font-weight:800;border-radius:10px;padding:3px 8px;text-transform:uppercase;flex:0 0 58px;text-align:center}
.pst.hit{background:var(--good-bg);color:var(--good)} .pst.missed{background:var(--bad-bg);color:var(--bad)} .pst.open{background:var(--warn-bg);color:var(--warn)}
.pw b{display:block;font-size:14px} .pw small{color:var(--muted);font-size:12px}
.hfield{margin:0 0 10px}
.opt .chev{color:var(--muted);font-size:20px}
.rnote.okn{background:var(--good-bg);color:var(--good)}
.chk li.risk i{color:#c48a12}

/* ---------- Drop 1.3 */
.dueline{margin-top:8px;font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:8px;padding:6px 10px}
.dueline b{color:var(--ink)}
.dueline.soon,.dueline.late{background:#fff4dd;color:#7a4d00}
.tslots{gap:10px}
.todo{border:1.5px solid var(--warn-line);border-radius:14px;background:#fffdf7;overflow:hidden}
.todoh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:11.5px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase;color:#7a4d00;background:#fdf0d2}
.todobar{padding:12px 14px 8px;border-bottom:1px solid #f2e3c0;background:#fff}
.todolist{padding:10px 10px 2px}
.todolist .rcard{margin-bottom:8px}
.pseg{display:flex;flex-direction:column;align-items:center}
.pseg i{width:100%}
.pav{margin-bottom:4px;display:flex;justify-content:center}
.pav .av{box-shadow:0 0 0 2px #fff}
.pseg.nothing .pav .av{opacity:.55}
.segbar.style-B .pseg i{margin-bottom:2px}
.mename{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-top:6px}
.ticket .tprog{border-bottom:1px solid var(--soft2)}

/* ---------- Drop 1.4 */
/* ticket: light green body; legs solid green; everyone else a dashed spot */
.ticket{background:#eef6f0;border-color:#b9d8c3}
.ticket .th{background:var(--good)}
.ticket.full{background:#dcefe2;border-color:#8fc2a0;box-shadow:0 0 0 3px #2e6b4522}
.ticket.full .th{background:#1f5a37}
.trow{background:#2e6b45;color:#fff;border-bottom:1px solid #ffffff2e}
.trow:hover{background:#285f3d}
.trow .tw small,.trow .to small{color:#cfe6d6}
.trow em.risk{color:#ffe1a1} .trow em.okn{color:#cfe6d6}
.tspot{display:flex;align-items:center;gap:10px;width:calc(100% - 20px);margin:8px 10px 0;padding:8px 12px;border:1.5px dashed #9cc5aa;border-radius:10px;background:#ffffff8c;text-align:left}
.tspot:hover{background:#fff}
.tspot .av{opacity:.75}
.tspot .tsn{flex:1;font-weight:700;font-size:14px;color:var(--ink)}
.tspot .tss{font-size:12px;color:var(--muted);font-weight:600}
.ticket .perf{margin-top:10px;border-top-color:#b9d8c3}
/* header: deadline chip next to the ticket name */
.tnrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 2px}
.tnrow .tname{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dchip{flex:0 0 auto;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.dchip.soon{background:#fdebc8;border-color:#e6b65a;color:#7a4d00}
.dchip.late{background:#fbe0dc;border-color:#e5a69c;color:#8f2f25}
/* thin progress strip on the header line, with a bump to open the full bar */
.rhead{border-bottom:0}
.strip{position:relative;background:#fff;border-bottom:1px solid var(--line);padding:2px 18px 9px;z-index:2}
.strip .pills{display:flex;gap:4px;width:100%;border:0;background:none;padding:0;cursor:pointer}
.strip .pills i{flex:1;height:7px;border-radius:4px;background:#dedfd8;box-sizing:border-box}
.strip .pills i.green{background:var(--good)} .strip .pills i.yellow{background:#e2b54d} .strip .pills i.nothing{background:#fff;border:1.5px dashed #e0a43a}
.strip .bump{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);width:54px;height:16px;padding:0 0 2px;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;font-size:11px;line-height:11px;color:var(--ink);cursor:pointer;box-shadow:0 2px 3px #0000000d}
.strip.open{padding-bottom:12px}
.stripfull{margin-top:10px}
.stripfull .sfh{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
/* the to-do stack: peek / open / thin */
.stackwrap{padding:16px 14px 0}
.stackwrap:empty{display:none}
.chat .stackwrap,.screen>.stackwrap{flex:0 0 auto;max-height:48%;overflow:auto}
.tdh,.sh{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#7a4d00;margin:0 0 6px}
.sh span{display:flex;align-items:center;gap:6px}
.smin{border:1px solid var(--warn-line);background:#fff;border-radius:8px;width:30px;height:24px;font-size:16px;line-height:1;color:#7a4d00;cursor:pointer}
.sdeck{position:relative;padding-bottom:22px}
.sdeck .need{position:relative;z-index:3;margin-bottom:0;box-shadow:0 2px 6px #0000000f}
.sbehind{position:absolute;left:0;right:0;bottom:0;height:40px;border:0;background:none;padding:0;cursor:pointer}
.sbehind i{position:absolute;left:10px;right:10px;bottom:10px;height:30px;border:1.5px solid var(--warn-line);border-top:0;border-radius:0 0 12px 12px;background:#fdf0d2}
.sbehind i.b2{left:20px;right:20px;bottom:3px;background:#fbe8bf}
.sbehind span{position:absolute;right:16px;bottom:-1px;z-index:4;font-size:11.5px;font-weight:700;color:#7a4d00;background:#fff;border:1px solid var(--warn-line);border-radius:999px;padding:1px 8px}
.stack.open .need{margin-bottom:8px}
.sless{display:block;margin:0 auto 4px;border:0;background:none;color:#7a4d00;font-weight:700;font-size:12.5px;text-decoration:underline;cursor:pointer}
.sthin{display:flex;align-items:center;gap:6px;width:100%;border:1.5px solid var(--warn-line);background:#fde7c2;color:#7a4d00;border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;text-align:left;cursor:pointer}
.sthin .stx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sthin.calm{background:var(--soft);border-color:var(--line);color:var(--ink)}
.sthin.flash{animation:flash 1.2s ease-in-out 2}
@keyframes flash{50%{background:#f7c66b}}
@media (prefers-reduced-motion:reduce){.sthin.flash{animation:none;outline:2px solid #e0a43a}}
/* still to do: rider cards only now; Captain can mark paid */
.todoh span:last-child{letter-spacing:.4px;text-transform:none;font-weight:700}
.manage .nb.markpaid{border-color:#9cc5aa;color:var(--good)}
.manage{gap:6px} .manage span{flex:1}
.confirmbox h2{margin-top:4px}
/* guided search */
.guide .gq{font-size:13px;color:var(--muted);margin:0 0 8px}
.gknown{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.gk{display:inline-flex;align-items:center;gap:6px;border:1px solid #b9d8c3;background:var(--good-bg);color:#234f35;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer}
.gk i{font-style:normal;color:#5b8a6b;font-weight:800}
.gtitle{margin:2px 0 6px}
.opt.other{border-style:dashed}
.gother{margin:6px 0 4px}
.gother label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.gother input{flex:1}

.hright{display:flex;align-items:center;gap:4px}
.rhead .setbtn{padding:6px}

/* ---------- Drop 1.5 */
/* ticket: white body, light green leg rows with dark text; only the header bar is dark */
.ticket{background:#fff;border-color:#c9dccf}
.ticket.full{background:#fff;border-color:#8fc2a0}
.ticket.full .th{background:var(--good)}
.trow{background:#eef6f0;color:var(--ink);border-bottom:1px solid #fff;border-left:4px solid #7fb592}
.trow:hover{background:#e3f0e7}
.trow .tw small,.trow .to small{color:var(--muted)}
.trow .tw b{font-weight:650}
.trow .to{color:var(--good)}
.trow em.risk{color:#8a5a00} .trow em.okn{color:var(--good)}

/* ---------- Drop 1.6 */

/* ---------- Drop 1.7 */

.sdeck{cursor:pointer}
/* avatars under the bar carry their state */

.sn.green b{color:var(--good)} .sn.yellow b{color:#8a6418} .sn.nothing b{color:#b8761a}

.snames{padding-top:4px}
/* your leg is locked (green version of the to-do stack) */

.lt2{flex:1;min-width:0}.lt2 b{display:block;color:var(--good);font-size:14px}.lt2 small{display:block;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lockbody{padding:0 10px 10px}.lockbody .pick{margin:0;background:#fff}

/* ---------- Drop 1.8 */
/* rider cards: one plain card; the box that needs attention carries the heat */
.rcard.plain{border:1px solid var(--line);background:#fff;padding:11px 12px}

/* your leg is locked: thin green bar like the to-do one-liner */
.locked{border:1.5px solid #9cc5aa;background:#e3f1e7;border-radius:10px}

.lt2{color:var(--good)}

.pickbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.replybar{display:flex;align-items:center;gap:8px;margin:0 10px;padding:7px 10px;border-left:3px solid var(--good);background:#eef6f0;border-radius:8px;font-size:12.5px}

.pickdir{margin:0 10px 6px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 4px 14px #0000001a;max-height:240px;overflow:auto;padding:6px}

/* ---------- search suggestions */
.sgh{font-size:11.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.lrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid #efc3bc}.lrow span{min-width:0}.lrow b{display:block;font-size:13.5px}.lrow small{display:block;font-size:12px;color:#7c3a30}
.locked.bad{border-color:#e5a69c;background:#fbe9e6}.locked.bad .lt2,.locked.bad .pinchev{color:#8f2f25}.locked.bad .lk{background:#c0503f}

/* live meters */
.meter2{display:block;margin-top:5px}

.sl{display:block;padding:0}

/* Drop 2.2: deadline line, option D */
button.dline{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:7px;flex-wrap:nowrap;white-space:nowrap;margin:4px 0 3px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;max-width:100%;overflow:hidden}

/* live test panel */
.ltl{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:12.5px}

.mparts{display:flex;gap:8px;align-items:flex-start}.mp{flex:1;min-width:0}.mp em{display:block;font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:3px}
.mpgoal{font-size:10.5px;font-weight:700;color:var(--ink);white-space:nowrap;padding-top:0}
/* leg sheet after placing: same live tracking as the ticket row */
.pick .odds .tp.big{display:inline-block;vertical-align:middle;margin:0 0 0 10px;font-size:12px;padding:3px 8px}

.pick.r-hit{background:#eef6f0;border-color:#b9d8c3}.pick.r-miss{background:#fbeeec;border-color:#efc3bc}
/* option B stack: the header is the one switch */
.shbtn{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;justify-content:space-between;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#7a4d00;margin:0 0 6px;padding:2px 2px}

.lockwrap{margin-top:14px}.locklbl{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--good);margin:0 0 6px}

  function findBetType(text, sportHint) {
    const t = ' ' + norm(text) + ' ';
    if (unsupportedName(text)) return null; // DraftKings-only wording wins: "Both Teams Total Points" is not a game total
    let best = null;
    for (const x of PHRASES) {
      const i = t.indexOf(' ' + x.p + ' ');

      if (best && x.p.length < best.p.length) break; // only consider the longest matching length
      const fits = x.bt.sport === '*' || !sportHint || x.bt.sport === sportHint;

    const t = ' ' + norm(text) + ' ';

  function parseOdds(s) {

    for (let k = m.length - 1; k >= 0; k--) { // the last signed number is usually the price

  function cleanParticipant(text) {

      .replace(/[−–—]/g, '-')
      .replace(/\bO\s*\/\s*U\b/gi, ' ')

<script>/* RIDE pick reader · compares a pick with live DraftKings outcomes from The Odds API.
   Never invents odds: every option shown comes from the provider response. */
(function (root) {
  const D = (typeof module !== 'undefined') ? require('./data.js') : root.RIDE_DATA;

  const normName = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[^a-z\s-]/g, ' ').replace(/-/g, ' ')
    .replace(/\b(jr|sr|ii|iii|iv|v)\b/g, ' ').replace(/\s+/g, ' ').trim();

  function lev(a, b) {
    if (a === b) return 0;
    const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  }
  const sim = (a, b) => { const L = Math.max(a.length, b.length); return L ? 1 - lev(a, b) / L : 1; };

  // 0..1 similarity between a typed/read name and a provider name.
  function nameScore(input, candidate) {
    const a = normName(input), b = normName(candidate);
    if (!a || !b) return 0;
    if (a === b) return 1;
    const A = a.split(' '), B = b.split(' ');
    let s = sim(a, b);
    const lastA = A[A.length - 1], lastB = B[B.length - 1];
    if (lastA === lastB || sim(lastA, lastB) >= 0.85) {
      const fa = A[0], fb = B[0];
      // "J. Brown", "Jaylen Brwn", OCR clipping "van Mobley"
      if (A.length === 1) s = Math.max(s, 0.7);
      else if (fa[0] === fb[0]) s = Math.max(s, 0.82 + 0.18 * sim(fa, fb));
      else if (fb.endsWith(fa) || fa.endsWith(fb)) s = Math.max(s, 0.8);
      else s = Math.max(s, 0.6 + 0.2 * sim(fa, fb));
    }
    if (b.includes(a) && a.length >= 4) s = Math.max(s, 0.8); // "Warriors" inside "Golden State Warriors"
    return s;
  }

  const MATCH_MIN = 0.78;

  function betType(id) { return D.BET_TYPES.find(b => b.id === id) || null; }
  function marketKeys(pick) {
    const bt = betType(pick.betTypeId);
    if (!bt) return [];
    const sfx = pick.period || '';
    return [bt.base, bt.alt].filter(Boolean).map(k => k + sfx);
  }

  // Flatten provider response into offers.
  function offersFrom(eventOdds, keys) {
    const out = [];
    const bm = (eventOdds && eventOdds.bookmakers || []).find(b => b.key === 'draftkings');
    if (!bm) return out;
    for (const m of bm.markets) {
      if (keys && !keys.includes(m.key)) continue;

        price: o.price, lastUpdate: m.last_update || bm.last_update || null });

    // can share a number but have different prices; both are real DraftKings offers.
    const seen = new Map();

  }

  const samePoint = (a, b) => a != null && b != null && Math.abs(a - b) < 0.01;
  // One option per number, preferring the market style the user used.
  function perPoint(list, pick) {
    const wantAlt = pick.milestone != null, m = new Map();
    for (const o of list) {
      const prev = m.get(o.point);

    }

  }

  /* result.status:
       EXACT          selection + line found, odds equal
       FOUND          selection + line found, no odds to compare (odds shown are DraftKings')
       ODDS_CHANGED   selection + line found, price differs
       LINE_CHANGED   player/side offered, but not at that number -> nearest real lines
       NEED_LINE      number unreadable -> real lines to choose from
       NO_PLAYER      market exists but this name isn't in it -> closest names

    } else if (bt.kind === 'choice') {
      pool = offers.filter(o => pick.side && o.name.toLowerCase() === pick.side.toLowerCase());
      if (!pool.length) { res.status = pick.side ? 'NO_PLAYER' : 'NEED_SIDE'; res.names = [...new Set(offers.map(o => o.name))]; return res; }
    } else if (bt.game) {

    } else {

      const field = offers.some(o => o.description) ? 'description' : 'name';
      const names = [...new Set(offers.map(o => o[field]).filter(Boolean))];
      const ranked = names.map(n => ({ n, s: nameScore(pick.participant, n) })).sort((a, b) => b.s - a.s);

        res.status = 'NO_PLAYER';
        res.names = ranked.slice(0, 3).filter(r => r.s >= 0.45).map(r => r.n);
        res.allNames = names.slice().sort();
        return res;
      }
      res.matchedName = ranked[0].n;
      pool = offers.filter(o => o[field] === ranked[0].n);
      if (field === 'description') {
        const side = bt.kind === 'yes' ? 'Yes' : (pick.side || 'Over');
        const sided = pool.filter(o => o.name === side);
        if (sided.length) pool = sided;
      }
    }
    res.matchedName = res.matchedName || (pool[0] && (pool[0].description || pool[0].name));

    const needsLine = bt.kind === 'ou' || bt.kind === 'teamline';
    if (!needsLine) {
      const o = pool[0];
      res.exact = o;
      res.status = pick.odds == null ? 'FOUND' : (o.price === pick.odds ? 'EXACT' : 'ODDS_CHANGED');
      return res;
    }

    const lined = pool.filter(o => o.point != null);
    if (pick.line == null) {
      res.status = 'NEED_LINE';
      const byOdds = pick.odds != null;
      res.options = perPoint(lined, pick).sort((a, b) => byOdds ? Math.abs(a.price - pick.odds) - Math.abs(b.price - pick.odds) : a.point - b.point)
        .slice(0, byOdds ? 3 : 8);
      if (byOdds && res.options[0] && res.options[0].price === pick.odds) res.note = 'odds-match';
      return res;
    }
    const atLine = lined.filter(o => samePoint(o.point, pick.line));
    // Prefer the offer with the user's exact price; else the market style they used ("20+" = milestone ladder).
    const wantAlt = pick.milestone != null;
    const hit = atLine.find(o => pick.odds != null && o.price === pick.odds)
      || atLine.find(o => o.market.includes('_alternate') === wantAlt) || atLine[0];
    if (hit) {
      res.exact = hit;
      res.status = pick.odds == null ? 'FOUND' : (hit.price === pick.odds ? 'EXACT' : 'ODDS_CHANGED');
      if (pick.unsure && pick.unsure.includes('line')) res.note = 'line-unsure';
      return res;
    }
    res.status = 'LINE_CHANGED';
    // Nearest real line is nowhere close (e.g. 126.5 vs 227.5): probably the wrong bet type, not a moved line.
    res.options = perPoint(lined, pick).sort((a, b) =>
      Math.abs(a.point - pick.line) - Math.abs(b.point - pick.line) ||
      (pick.odds != null ? Math.abs(a.price - pick.odds) - Math.abs(b.price - pick.odds) : 0)).slice(0, 3);
    if (res.options[0] && Math.abs(res.options[0].point - pick.line) > Math.max(3, Math.abs(pick.line) * 0.2)) res.status = 'FAR_OFF';
    return res;
  }

  // Which upcoming game does a pick belong to?
  function guessEvent(events, hints) {
    if (!events || !events.length || !hints || !hints.length) return null;
    const scored = events.map(e => {
      let s = 0;
      for (const h of hints) if (h === e.home_team || h === e.away_team) s++;
      return { e, s };
    }).filter(x => x.s >= Math.min(2, hints.length)).sort((a, b) => b.s - a.s || new Date(a.e.commence_time) - new Date(b.e.commence_time));
    return scored[0] ? scored[0].e : null;
  }

  const api = { normName, nameScore, marketKeys, offersFrom, evaluate, guessEvent, betType };
  if (typeof module !== 'undefined') module.exports = api; else root.RIDE_MATCH = api;

<script>/* BOZO · pick module (embedded in the BOZO shell). Based on the RIDE pick demo v2.
   Photo or typed pick -> (free reader, AI backup) -> game found (slip or ESPN) -> DraftKings checked
   automatically -> "We found your pick" confirm page. Edit page only when something needs fixing.
   Keys (Odds API, Claude) live only in this browser. No wagers are placed. */
(function () {
  const D = window.RIDE_DATA, P = window.RIDE_PARSE, M = window.RIDE_MATCH, X = window.RIDE_SERVICES;
  const API = 'https://api.the-odds-api.com/v4/';
  const OCR_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  const $ = s => document.querySelector(s);
  const B = () => window.BOZO || {};
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem('ride.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('ride.' + k, JSON.stringify(v)); } catch { /* private mode: memory only */ } },
  };
  const today = () => new Date().toISOString().slice(0, 10);
  // Game times are compared with the app's clock (the demo can rewind/fast-forward it).
  const clockNow = () => (window.BOZO_APP && window.BOZO_APP.now ? window.BOZO_APP.now() : Date.now());

  const S = {
    screen: 'home', back: [], sport: store.get('sport', 'nfl'),
    key: store.get('key', ''), aiKey: store.get('aiKey', ''),
    credits: store.get('credits', null), events: {}, oddsCache: {},
    spend: (() => { const s = store.get('spend', null); return s && s.day === today() ? s : { day: today(), odds: 0, ai: 0, reads: 0, log: [] }; })(),
    file: null, image: null, ocrText: '', progress: 0, progressLabel: '', legs: [], readBy: '', aiError: '', thumb: null, capReason: '', capKind: '',
    pick: null, result: null, choice: null, acked: {}, aiTried: false, player: null,
    picks: store.get('picks', []), sheet: null, error: '', busy: false, typed: '', status: '',
  };

  // ---------- spend tracking (visible on every screen)
  function logSpend(kind, amount, what) {
    if (!amount) return;
    if (kind === 'odds') S.spend.odds += amount; else { S.spend.ai += amount; S.spend.reads += 1; }
    S.spend.log.unshift({ t: Date.now(), kind, amount, what });
    S.spend.log = S.spend.log.slice(0, 25);
    store.set('spend', S.spend);
  }
  const money = n => n < 0.01 ? '$' + n.toFixed(4) : '$' + n.toFixed(2);

  // ---------- formatting
  const fmtOdds = n => n == null || n === '' ? '—' : (Number(n) > 0 ? '+' + Number(n) : String(n));
  const periodLabel = s => (D.PERIODS.find(p => p.suffix === s) || {}).label || '';
  const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m === 1 ? '1 min ago' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' hr ago'; };
  const clock = iso => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const short = n => n.split(' ').slice(-1)[0];
  function gameLabel(e) {
    const t = new Date(e.commence_time), now = new Date(clockNow());
    const day = t.toDateString() === now.toDateString() ? 'Today' : t.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    return `${t < now ? 'Live · ' : ''}${e.away_team} @ ${e.home_team} — ${day} ${clock(e.commence_time)}`;
  }
  const isMilestone = (side, line, market) => side === 'Over' && line != null && Number.isInteger(line + 0.5) && (market ? market.includes('_alternate') : true);
  // "75+ Passing Yards · 1st Quarter", "Over 11.5 Rebounds", "Anytime TD Scorer", "Eagles -3.5"
  function betText({ betTypeId, period, side, line, market, milestone }) {
    const bt = M.betType(betTypeId); if (!bt) return 'Bet type not set';
    const per = period ? ' · ' + periodLabel(period) : '';
    if (bt.kind === 'yes') return bt.label + per;
    if (bt.kind === 'choice') return bt.label + ': ' + (side || '—') + per;
    if (bt.kind === 'team') return (bt.id === 'moneyline' || bt.id === 'soc_ml' ? 'Moneyline' : bt.label) + per;
    if (bt.kind === 'teamline') return 'Spread ' + (line == null ? '—' : (line > 0 ? '+' : '') + line) + per;
    if (line == null) return bt.label + per;
    const ms = market ? isMilestone(side, line, market) : milestone != null && side === 'Over';
    return (ms ? (line + 0.5) + '+ ' : side + ' ' + line + ' ') + bt.label + per;
  }
  const who = p => { const bt = M.betType(p.betTypeId); return bt && bt.kind === 'choice' ? 'Game' : bt && bt.game ? 'Game total' : (p.participant || 'Player not set'); };
  function toast(msg) {
    document.querySelectorAll('.toast').forEach(x => x.remove());
    const t = document.createElement('div'); t.className = 'toast'; t.role = 'status'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 4200);
  }
  const icon = (n, s = 24) => {
    const p = {
      photo: '<rect x="3" y="3" width="15" height="15" rx="2"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M18 13l-3.5-3.5L5 18M19 2v6M16 5h6"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', chev: '<path d="M9 6l6 6-6 6"/>', back: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
      paste: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/>', camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
      gear: '<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/>',
      check: '<path d="M5 12l5 5 9-10"/>', alert: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',
    }[n];
    return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  };

  // ---------- The Odds API
  async function call(path, params = {}) {
    if (!S.key) { (B().openSettings || openSettings)('Add your Odds API key to load DraftKings data.'); throw new Error('nokey'); }
    let res;
    try { res = await fetch(API + path + '?' + new URLSearchParams({ apiKey: S.key, ...params })); }
    catch { throw new Error('Couldn’t reach The Odds API. Check your internet connection.'); }
    const h = k => res.headers.get(k);
    if (h('x-requests-remaining') != null) {
      S.credits = { remaining: Number(h('x-requests-remaining')), used: Number(h('x-requests-used')), last: Number(h('x-requests-last') || 0), at: Date.now() };
      store.set('credits', S.credits);
    }
    if (res.status === 401) throw new Error('That Odds API key didn’t work. Open settings (gear icon) and check it.');
    if (res.status === 429) throw new Error('Out of Odds API credits or too many requests. Your pick is kept — try again later.');
    if (res.status === 404 || res.status === 422) { const b = await res.json().catch(() => ({})); throw new Error(b.message || 'That game is no longer available (it may have finished).'); }
    if (!res.ok) throw new Error('The Odds API returned an error (' + res.status + ').');
    return res.json();
  }
  async function loadEvents(sport, force) {
    const c = S.events[sport];
    if (c && !force && Date.now() - c.at < 5 * 60000) return c.list;
    const list = await call('sports/' + D.SPORTS[sport].key + '/events'); // free
    list.sort((a, b) => new Date(a.commence_time) - new Date(b.commence_time));
    S.events[sport] = { at: Date.now(), list };
    return list;
  }
  /* Odds are saved per market for 10 minutes, so a market is only paid for once (in the real app the
     whole crew shares this). Asking for spreads + alternate spreads when spreads is saved costs 1 credit, not 2. */
  const ODDS_TTL = 10 * 60000;
  async function loadOdds(sport, eventId, keys, force, label) {
    const ck = k => eventId + '|' + k;
    const fresh = c => c && Date.now() - c.at < ODDS_TTL;
    const need = force ? keys : keys.filter(k => !fresh(S.oddsCache[ck(k)]));
    let cost = 0;
    if (need.length) {
      const data = await call(`sports/${D.SPORTS[sport].key}/events/${eventId}/odds`, { bookmakers: 'draftkings', markets: need.join(','), oddsFormat: 'american' });
      cost = S.credits ? S.credits.last : 0;
      logSpend('odds', cost, label);
      const bm = (data.bookmakers || []).find(b => b.key === 'draftkings');
      const ev = { id: data.id, sport_key: data.sport_key, commence_time: data.commence_time, home_team: data.home_team, away_team: data.away_team };
      need.forEach(k => { S.oddsCache[ck(k)] = { at: Date.now(), ev, market: bm ? (bm.markets || []).find(m => m.key === k) || null : null }; });
    }
    const parts = keys.map(k => S.oddsCache[ck(k)]);
    const markets = parts.map(x => x.market).filter(Boolean);
    const data = { ...parts[0].ev, bookmakers: markets.length ? [{ key: 'draftkings', markets }] : [] };
    return { data, at: Math.min(...parts.map(x => x.at)), cached: !need.length, cost };
  }

  // ---------- free reader (in-browser)
  let ocrWorker = null;
  const loadScript = src => new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => fail(new Error('Couldn’t load the screenshot reader. Check your connection.')); document.head.appendChild(s); });
  async function getWorker() {

          ${a.captainReason ? `<p class="small" style="margin:10px 0 0"><strong>For your Captain:</strong> ${esc(a.captainReason)}${a.captainNote ? ' · “' + esc(a.captainNote) + '”' : ''}</p>` : ''}
          ${a.screenshot ? `<details class="raw"><summary>Screenshot attached</summary><img src="${a.screenshot}" alt="Screenshot" style="width:100%;border-radius:8px;margin-top:8px"></details>` : ''}</div>
        <button class="btn primary" data-act="home">Done</button><button class="btn" data-act="change">Change my pick</button>
        ${S.picks.length > 1 ? `<div class="history"><h3>Pick history</h3>${S.picks.slice(1, 6).map(x => `<div>Rev ${x.revision} · ${esc(x.participant)} · ${esc(x.displayBet)} · ${fmtOdds(x.americanOdds)}</div>`).join('')}</div>` : ''}
        <p class="tiny muted" style="margin-top:18px">Demo: picks are kept on this device only.${a.screenshot ? ' A small copy of the screenshot is kept with this pick for your Captain.' : ' Your screenshot was not stored.'}</p></div>`;
    },
  };
  // Always reflects the current settings (not whatever was true when the screenshot was read).
  function readNote() {
    if (S.readBy === 'typed' || !S.readBy) return S.aiError && S.readBy === 'typed' ? 'AI search unavailable (' + S.aiError + ') · matched on this device' : '';
    if (S.readBy === 'ai-typed') return 'Search read with AI';
    if (S.readBy === 'ai' || S.readBy === 'ai-fixed') return 'Read with AI · double-checked on this device';
    return S.aiError === 'no key' ? 'Read on this device only · add a Claude key in Keys for the AI reader' : S.aiError ? 'AI unavailable (' + S.aiError + ') · read on this device, please double-check' : 'Read on this device';
  }
  async function makeThumb(file) {
    try {
      const url = URL.createObjectURL(file), img = new Image(); img.src = url; await img.decode();
      const sc = Math.min(1, 420 / img.naturalWidth), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      return c.toDataURL('image/jpeg', 0.7);
    } catch { return null; }
  }
  function rawText() { return S.ocrText ? `<details class="raw"><summary>Show what the free reader saw</summary><pre>${esc(S.ocrText)}</pre></details>` : ''; }
  function statusFlag(v) {
    return ({ EXACT_MATCH: '<span class="flag good">✓ Matches DraftKings</span>', FOUND: '<span class="flag good">✓ Found on DraftKings</span>',
      ODDS_CHANGED_ACCEPTED: '<span class="flag good">✓ New odds accepted</span>', LINE_CHANGED_ACCEPTED: '<span class="flag good">✓ Closest line accepted</span>',
      CAPTAIN_REVIEW: '<span class="flag neutral">Manual review by Captain</span>' })[v] || '';
  }

  function settingsSheet(msg) {
    const c = S.credits, sp = S.spend;
    return `<div class="sheet-bg" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="Settings" data-stop>
      <div class="grab"></div><h2>Settings & costs</h2>${msg ? `<div class="banner warn"><p>${esc(msg)}</p></div>` : ''}
      <div class="pick"><div class="who">Odds API credits</div><div class="sel">${c ? c.remaining + ' left this month' : 'Not checked yet'}</div>
        <div class="src">Today: ${sp.odds} used${c ? ` · ${c.used} used this month` : ''}. Listing games and ESPN lookups are free.</div>
        <div class="who" style="margin-top:12px">AI backup reader</div><div class="sel" style="font-size:16px">${sp.reads} read${sp.reads === 1 ? '' : 's'} today · ≈${money(sp.ai)}</div>
        <div class="src">Only used when the free reader struggles. ≈$0.0003–0.0005 per screenshot (estimate).</div>
        <div class="who" style="margin-top:12px">Picks today</div><div class="sel" style="font-size:16px">${(sp.picks || {}).auto || 0} checked automatically · ${(sp.picks || {}).captain || 0} sent to Captain</div>
        ${sp.log.length ? `<details class="raw"><summary>Today’s activity</summary><pre>${esc(sp.log.map(l => `${new Date(l.t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}  ${l.kind === 'odds' ? l.amount + ' credit' + (l.amount > 1 ? 's' : '') : '≈$' + l.amount.toFixed(4)}  ${l.what}`).join('\n'))}</pre></details>` : ''}</div>
      <form id="keyform">
        <div class="f"><label for="key">The Odds API key</label><input id="key" name="key" type="password" autocomplete="off" value="${esc(S.key)}" placeholder="Paste your key"></div>
        <div class="f"><label for="aiKey">Claude API key <span class="muted">(AI backup, optional)</span></label><input id="aiKey" name="aiKey" type="password" autocomplete="off" value="${esc(S.aiKey)}" placeholder="sk-ant-…">
          <div class="hint">Both keys are saved only in this browser and sent only to their own service.</div></div></form>
      <button class="btn primary" data-act="save-key">Save keys</button>
      <button class="btn" data-act="clear-cache">Clear saved odds</button><button class="btn" data-act="close-sheet">Close</button></div></div>`;
  }
  function cameraSheet() {
    return `<div class="sheet-bg" data-act="close-cam"><div class="sheet" role="dialog" aria-modal="true" aria-label="Take photo" data-stop><div class="grab"></div>
      <h2>Take a photo</h2><video id="video" autoplay playsinline muted></video><button class="btn primary" data-act="snap">Capture</button><button class="btn" data-act="close-cam">Cancel</button></div></div>`;
  }
  function openSettings(msg) { S.sheet = settingsSheet(msg); render(); setTimeout(() => { const k = $(S.key ? '#aiKey' : '#key'); if (k && !k.value) k.focus(); }, 50); }

  // ---------- render + events
  function render() {
    const root = $('#pick-root'); if (!root) return;
    root.innerHTML = `${screens[S.screen]()}${S.sheet || ''}`;
    const fi = $('#file'), ci = $('#cam');
    if (fi) fi.onchange = e => e.target.files[0] && readImage(e.target.files[0]);
    if (ci) ci.onchange = e => e.target.files[0] && readImage(e.target.files[0]);
    const drop = $('#drop');
    if (drop) {
      drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
      drop.ondragleave = () => drop.classList.remove('over');
      drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) readImage(f); };
    }
    const ef = $('#edit');
    if (ef) ef.onchange = e => { if (['betTypeId', 'eventId', 'line'].includes(e.target.name)) { readForm(); render(); } };
    const tf = $('#typed'); if (tf) tf.onsubmit = e => { e.preventDefault(); handle('typed'); };
    const qi = $('#q'); if (qi && S.screen === 'search') { qi.oninput = () => { S.typed = qi.value; paintSugg(); }; prepSuggest(); }
    const go2 = $('#gother'); if (go2) go2.onsubmit = e => { e.preventDefault(); handle('g-other'); };
    const gf = $('#gfilter'); if (gf) gf.oninput = () => { S.gFilter = gf.value; const pos = gf.selectionStart; render(); const n = $('#gfilter'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } };
    const kf = $('#keyform'); if (kf) kf.onsubmit = e => { e.preventDefault(); handle('save-key'); };
  }
  function paintProgress() { const b = $('#pbar'), l = $('#plabel'); if (b) b.style.width = Math.max(2, S.progress) + '%'; if (l) l.textContent = S.progressLabel; }

  let stream = null;
  async function handle(act, v) {
    switch (act) {
      case 'back': if (S.screen === 'guide' && gUndo()) return; return goBack();
      case 'home': return B().exitPick && B().exitPick();
      case 'to': S.error = ''; return go(v);
      case 'sport': S.sport = v; store.set('sport', v); if (S.pick && S.screen === 'edit') { readForm(); S.pick.sport = v; S.pick.eventId = null; loadEvents(v).then(render).catch(e => { if (e.message !== 'nokey') toast(e.message); }); } return render();
      case 'settings': return (B().openSettings || openSettings)();
      case 'close-sheet': S.sheet = null; return render();
      case 'save-key': {
        const k = ($('#key').value || '').trim(), a = ($('#aiKey').value || '').trim();
        if (!/^[a-f0-9]{32}$/i.test(k)) return toast('That doesn’t look like an Odds API key (32 letters and numbers).');
        if (a && !/^sk-ant-/.test(a)) return toast('Claude keys start with “sk-ant-”.');
        S.key = k; S.aiKey = a; store.set('key', k); store.set('aiKey', a); S.sheet = null; render();
        try { await loadEvents(S.sport, true); toast('Saved. Connected to The Odds API' + (a ? ' · AI backup on.' : '.')); render(); } catch (e) { if (e.message !== 'nokey') toast(e.message); }
        return;
      }
      case 'clear-cache': S.oddsCache = {}; S.events = {}; toast('Saved odds cleared. Next check fetches fresh lines.'); return;
      case 'choose': return $('#file').click();
      case 'paste': {
        if (!navigator.clipboard || !navigator.clipboard.read) return toast('Press ⌘V (or Ctrl+V) to paste your screenshot.');
        try {
          for (const it of await navigator.clipboard.read()) { const t = it.types.find(x => x.startsWith('image/')); if (t) { const b = await it.getType(t); return readImage(new File([b], 'pasted', { type: t })); } }
          toast('No image on your clipboard. Copy a screenshot first.');
        } catch { toast('Your browser blocked clipboard access. Press ⌘V (or Ctrl+V) instead.'); }
        return;
      }
      case 'camera': {
        if (matchMedia('(pointer:coarse)').matches || !navigator.mediaDevices?.getUserMedia) return $('#cam').click();
        try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); } catch { return toast('Camera not available. Choose a photo instead.'); }
        S.sheet = cameraSheet(); render(); $('#video').srcObject = stream; return;
      }
      case 'snap': {
        const vid = $('#video'); const c = document.createElement('canvas'); c.width = vid.videoWidth; c.height = vid.videoHeight; c.getContext('2d').drawImage(vid, 0, 0);
        stream && stream.getTracks().forEach(t => t.stop()); stream = null; S.sheet = null;
        return c.toBlob(b => readImage(new File([b], 'camera.png', { type: 'image/png' })), 'image/png');
      }
      case 'close-cam': stream && stream.getTracks().forEach(t => t.stop()); stream = null; S.sheet = null; return render();
      case 'leg': return S.readBy === 'typed' || S.readBy === 'ai-typed' ? gStart(S.legs[Number(v)], S.typed) : resolve(S.legs[Number(v)]);
      case 'example': S.typed = v; return render();
      case 'sugg': { const x = (S.suggList || [])[Number(v)]; if (!x) return; S.ocrText = ''; S.file = null; S.image = null; S.thumb = null; S.readBy = 'typed'; S.pick = null; S.player = null;
        rememberQ(x.q); S.typed = x.q; if (!x.leg) { render(); return handle('typed'); } return gStart({ ...x.leg }, x.q); }
      case 'typed': {
        const q = ($('#q').value || '').trim(); S.typed = q;
        if (!q) return toast('Type your pick first.');
        rememberQ(q);
        S.ocrText = ''; S.file = null; S.image = null; S.thumb = null; S.readBy = 'typed'; S.aiError = ''; S.pick = null; S.player = null;
        const n = P.norm(q);
        const dkOnly = P.unsupportedName(q);
        if (dkOnly) { // e.g. "both teams over 105.5": a DraftKings special our odds data doesn't carry
          const leg = (P.parseTyped(q, isSoccer(S.sport) ? 'nba' : S.sport).legs || [])[0] || {};
          const teamWords = new Set(P.findTeams(q).flatMap(x => (D.TEAMS[x.sport].find(r => r[0] === x.full) || []).map(w => P.norm(w))));
          const nice = P.titleCase(P.norm(q).split(' ').filter(w => !teamWords.has(w)).join(' ').replace(/\bo\b/g, 'over').replace(/\bu\b/g, 'under'));
          return resolve({ ...leg, betTypeId: null, label: nice, betLabel: nice, headerText: '', participant: 'Game', side: null, line: null, unsupported: dkOnly, source: 'typed', gameHint: leg.gameHint && leg.gameHint.length ? leg.gameHint : P.findTeams(q).map(x => x.full) });
        }
        if (isSoccer(S.sport)) { // soccer: no AI needed; teams come from the game lists, bets from a short phrase list
          const sb = soccerBet(q, []); const leg = { sport: S.sport === 'soccer' ? 'soccer' : S.sport, ...sb };
          if (/^(soccer|football|futbol|epl|premier league|champions league|ucl|mls)( games?)?$/.test(n)) return gStart({ sport: S.sport }, q);
          return gStart(leg, q);
        }
        if (SPORT_ONLY.test(n)) return gStart({ sport: /nfl|football/.test(n) ? 'nfl' : 'nba' }, q); // "nba" -> the games
        const vk = vagueKind(q);
        if (vk && vk !== 'player') { // only team names (maybe a number): nothing for the AI to work out
          const tm = P.findTeams(q), num = (q.match(/(\d+(?:\.\d+)?)/) || [])[1], sgn = q.match(/(?:^|\s)([+-]\d+(?:\.\d+)?)\b/);
          if (sgn && tm.length === 1) return gStart({ sport: tm[0].sport, gameHint: [tm[0].full], betTypeId: 'spread', participant: tm[0].full, side: tm[0].full, line: Number(sgn[1]) }, q);
          return gStart({ sport: tm[0].sport, gameHint: tm.map(t => t.full), line: num != null ? Number(num) : null }, q);
        }
        let legs = [];
        if (S.aiKey) { // the AI reads searches the way a person would ("bulls knicks over 233.5", "bron 25+")
          S.status = 'Understanding your search'; go('finding');
          try {
            const r = await X.aiReadText(q, S.aiKey); logSpend('ai', r.cost, 'AI search · ' + q.slice(0, 40));
            legs = r.legs.map(a => ({ ...P.legFromAI({ ...a, odds: /[+-]\d{3,}/.test(q) ? a.odds : undefined }, S.sport), source: 'typed' }));
            if (legs.length) S.readBy = 'ai-typed';
          } catch (e) { S.aiError = e.message; }
        }
        if (!legs.length) legs = P.parseTyped(q, S.sport).legs;
        S.legs = legs;
        if (legs.length > 1) return go('legs', S.screen === 'finding');
        const leg = { ...(legs[0] || {}) };
        if (vk === 'player') { leg.betTypeId = null; leg.side = null; leg.line = null; leg.label = ''; leg.betLabel = ''; leg.unsupported = null; } // just a name: ask which bet
        return gStart(leg, q);
      }
      case 'g-pick': { const o = S.gq.opts[Number(v)]; if (!o) return; snap(); o.apply(); const po = S.g.pickedOffer; if (po) { delete S.g.pickedOffer; return finish(po, S.gR); } return gNext(); }
      case 'g-clear': return gClear(v);
      case 'g-other-open': S.gOther = true; render(); setTimeout(() => { const t = $('#gtext'); if (t) t.focus(); }, 0); return;
      case 'g-other': return gOtherAnswer(($('#gtext') || {}).value);
      case 'g-captain': return gToCaptain();
      case 'reuse': return B().reuseLookup && B().reuseLookup(v);
      case 'side': readForm(); S.pick.side = v; return render();
      case 'check': readForm(); return check(false, false);
      case 'refresh': return check(true, false);
      case 'edit': S.error = ''; return go('edit');
      case 'rename': S.pick.participant = v; S.pick.source = 'typed'; return check(false, false);
      case 'ack': S.acked[v] = true; return render();
      case 'choose-opt': S.choice = Number(v); return render();
      case 'use-opt': { const o = S.result.options[S.choice]; if (!o) return; return save(S.result.status === 'NEED_LINE' ? (o.price === S.pick.odds ? 'EXACT_MATCH' : 'FOUND') : 'LINE_CHANGED_ACCEPTED', o); }
      case 'save': return save(v);
      case 'captain': case 'to-captain': S.capReason = captainReason(); S.capKind = ''; return go('captain');
      case 'send-captain': return save('CAPTAIN_REVIEW', null);
      case 'send-confirmed': S.riderConfirmed = true; return save('CAPTAIN_REVIEW', null);
      case 'exit': return B().exitPick && B().exitPick();
      case 'change': case 'new-pick':
        S.pick = null; S.result = null; S.legs = []; S.choice = null; S.acked = {}; S.error = ''; S.ocrText = ''; S.capReason = '';
        S.back = []; S.screen = 'upload'; render(); return;
    }
  }
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');

  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet && $('#pick-root')) handle(S.sheet.includes('video') ? 'close-cam' : 'close-sheet'); });

  // ---- public API for the BOZO shell
  function start(opts = {}) {
    S.pick = null; S.result = null; S.legs = []; S.choice = null; S.acked = {}; S.error = ''; S.ocrText = ''; S.capReason = ''; S.capKind = '';
    S.file = null; S.image = null; S.thumb = null; S.readBy = ''; S.typed = '';
    S.back = []; S.screen = opts.screen || 'upload'; render();
  }
  /* Recheck a saved pick against DraftKings (used for "Refresh my leg", "Refresh all" and the picks-due check). */
  async function checkLeg(entry, force) {
    const sport = Object.keys(D.SPORTS).find(k => D.SPORTS[k].key === entry.sportKey) || S.sport;
    const p = { sport, eventId: entry.eventId, betTypeId: entry.betTypeId, period: entry.period || '', participant: entry.participant, side: entry.outcomeSide,
      line: entry.line, milestone: null, odds: entry.americanOdds, unsure: [] };
    const r = await loadOdds(sport, entry.eventId, M.marketKeys(p), force, 'Recheck · ' + (entry.participant || '') + ' ' + (entry.displayBet || ''));
    return { ...M.evaluate(p, r.data), at: r.at, cost: r.cached ? 0 : r.cost };
  }
  function setKeys(k, a) { S.key = k; S.aiKey = a; store.set('key', k); store.set('aiKey', a); }
  window.RIDE_APP = { S, gStart, completeBet, handle, readImage, prep, getWorker, start, render, checkLeg, setKeys, loadEvents, betText, fmtOdds, logSpend, money };
})();

      } else { s.issue = { kind: 'moved', lineChange: false, from: `${e.displayBet} (${fmtOdds(e.americanOdds)})`, to: `${e.displayBet} (${fmtOdds(r.exact.price)})`, line: e.line, price: r.exact.price }; sys(`${nm(id)}’s odds moved a lot · needs ${nm(id)} to accept`, t); }
      return;
    }
    if (r.status === 'LINE_CHANGED' && r.options && r.options[0]) {
      const o = r.options[0], txt = PK().betText({ betTypeId: e.betTypeId, period: e.period, side: o.name, line: o.point, market: o.market });
      s.issue = { kind: 'moved', from: `${e.displayBet} (${fmtOdds(e.americanOdds)})`, to: `${txt} (${fmtOdds(o.price)})`, toDisplay: txt, line: o.point, price: o.price };
      return;
    }

  }
  function crew(v) {

      const e = mine && family(mine.marketKey) === 'ml' && mine.eventId === EV.chabkn ? (mine.outcomeSide === 'Brooklyn Nets' ? LEGS.chaML() : LEGS.bknML()) : LEGS.bknML();
      e.createdAt = new Date(now()).toISOString(); t.slots[who].pick = e; t.slots[who].issue = null; sys(`${nm(who)} added a pick · ${legDesc(e)}`);
