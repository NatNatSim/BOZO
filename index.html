  /* Demo replay: a real slate that's already been played (Nov 8, 2026), scored from saved ESPN results. Odds are made up. */
  const RG = { lal: ['Los Angeles Lakers @ Detroit Pistons', '2026-11-08T23:00:00Z', 'basketball_nba'], dal: ['Brooklyn Nets @ Dallas Mavericks', '2026-11-09T00:30:00Z', 'basketball_nba'],
    kc: ['New York Jets @ Kansas City Chiefs', '2026-11-08T18:00:00Z', 'americanfootball_nfl'], ne: ['Green Bay Packers @ New England Patriots', '2026-11-08T21:25:00Z', 'americanfootball_nfl'] };
  const rEntry = (g, betTypeId, participant, side, line, price, display, marketKey) => ({ id: 'pick_' + Math.random().toString(36).slice(2, 8), revision: 1, createdAt: new Date(now()).toISOString(), sportKey: RG[g][2], eventId: 'replay-' + g, event: RG[g][0], commenceTimeUtc: RG[g][1],
    bookmakerKey: 'draftkings', marketKey, betTypeId, period: '', participant, outcomeSide: side, line, displayBet: display, americanOdds: price, validation: 'FOUND', checkedAt: new Date(now()).toISOString(), source: 'typed', seeded: true });
  function replayTicket(variant, stage) {

  /* Map thumbnails can't wait for ESPN, so they use the same results written down. */

        john: RT('in', null, 'Covering (80–57, -4.5)', 'Nets 57 · Mavericks 80', 'Q3 5:12'), dre: RT('in', null, '36 rush yds · needs 60', 'Jets 7 · Chiefs 21', '3rd 6:40'), sam: RT('in', null, '223 pass yds · needs 250', 'Packers 27 · Patriots 16', '3rd 6:40') }
      : { simmy: RT('post', 'hit', '43 pts ✓', 'Lakers 121 · Pistons 116', 'Final'), nate: variant === 'won' ? RT('post', 'hit', 'Done ✓', 'Lakers 121 · Pistons 116', 'Final') : RT('post', 'miss', '14 pts · final', 'Lakers 121 · Pistons 116', 'Final'),
        mike: RT('post', 'hit', '121–116 final', 'Lakers 121 · Pistons 116', 'Final'), john: RT('post', 'hit', 'Covered (130–93, -4.5)', 'Nets 93 · Mavericks 130', 'Final'), dre: RT('post', 'hit', '61 rush yds ✓', 'Jets 12 · Chiefs 35', 'Final'), sam: RT('post', 'hit', '372 pass yds ✓', 'Packers 45 · Patriots 27', 'Final') };

  // ---------- moments (jump straight to a situation)
  const MOMENTS = [
    { id: 'fresh', role: 'captain', title: 'Start: a ticket in progress', sub: '3 picks in, money coming in', run() {} },
    { id: 'invited', role: 'captain', at: 'group', title: 'Invited to a ticket', sub: '@jb invited you · Accept or Decline', run() {} },
    { id: 'groups', role: 'captain', at: 'group', title: 'Your groups', sub: 'Swipe between groups · See all · New group', run() { G.sheet = { k: 'groups' }; } },
    { id: 'whose', role: 'captain', title: 'Whose leg is this?', sub: 'The placed slip has a leg nobody picked', run() { replayTicket('lost', 'ready'); const t = T(); t.slots.sam.pick = null;
      const legs = t.riders.filter(id => t.slots[id].pick).map(id => { const e = t.slots[id].pick; return { player_or_team: e.participant, stat: e.displayBet, line: e.line, odds: e.americanOdds }; });

    { id: 'dkconfirm', role: 'rider', title: '“It’s on DraftKings”', sub: 'A DraftKings-only pick, confirmed by the rider', run() { startPick(false); const A = PK(); A.S.pick = { sport: 'nba', participant: 'Game', label: 'Both Teams 100+ Points', headerText: 'Alt totals', odds: -150, source: 'typed' };
      A.S.capKind = 'dk-only'; A.S.capTitle = 'DraftKings-only bet'; A.S.capReason = '“Both Teams 100+ Points” isn’t in our odds data, so we can’t confirm it here.'; A.S.screen = 'captain'; render(); return true; } },
    { id: 'pick', role: 'rider', title: 'Make your pick', sub: 'The real reader + live DraftKings check', run() { startPick(false); return true; } },
    { id: 'vague', role: 'rider', title: 'Guided search (“hornets”)', sub: 'It asks only what’s missing', run() { startPick(false); PK().start({ screen: 'search' }); PK().S.typed = 'hornets'; PK().render(); return true; } },
    { id: 'nba', role: 'rider', title: 'Search just “nba”', sub: 'Shows the games to pick from', run() { startPick(false); PK().start({ screen: 'search' }); PK().S.typed = 'nba'; PK().render(); return true; } },

    { id: 'confirm', role: 'captain', title: 'Confirm a payment', sub: 'John tapped “I sent it”', run() {} },
    { id: 'markpaid', role: 'captain', title: 'Mark someone paid', sub: 'Dre paid without tapping “I sent it”', run() { G.sheet = { k: 'markpaid', v: 'dre' }; } },

    { id: 'oddsmove', role: 'rider', title: 'Your odds moved a little', sub: 'Stays on the ticket, shown in green', run() { const t = T(); t.slots.nate.pick = LEGS.randle(); t.slots.nate.pay = 'confirmed'; G.script.moveAtDue = { id: 'nate', priceOnly: true, price: -115 }; fastForward('due'); return true; } },

    { id: 'soonrider', role: 'rider', title: 'Deadline in 25 min (no pick)', sub: 'Add-your-leg card on top', run() { fastForward('soon'); return true; } },

    { id: 'nocombine', role: 'captain', title: 'DraftKings won’t combine a leg', sub: 'Captain flags it in one tap', run() { const t = T(); t.slots.simmy.pick = LEGS.chaSpread(); G.sheet = { k: 'card', v: 'john' }; } },
    { id: 'bounced', role: 'rider', title: 'Your leg got bounced', sub: 'What the crew member sees', run() { const t = T(); t.slots.nate.pick = LEGS.bknML(); t.slots.nate.issue = { kind: 'nocombine', with: null }; sys('DraftKings won’t combine Nate’s leg with the rest of the slip — Nate needs a new leg'); G.tab = 'chat'; } },
    { id: 'blocked', role: 'rider', title: 'Other side of a pick: blocked', sub: 'Nets ML vs John’s Hornets ML', run() { G.pending = { entry: LEGS.bknML(), kind: 'ok' }; remember(G.pending.entry); G.screen = 'added'; } },
    { id: 'dkonly', role: 'captain', title: 'A DraftKings-only bet to check', sub: 'Both Teams Total Points', run() { crew('sam-dk'); return true; } },
    { id: 'buyin', role: 'captain', title: 'Change the buy-in', sub: 'Pay-the-difference or refund to-dos', run() { G.sheet = { k: 'settings' }; G.editBuy = true; } },
    { id: 'refund', role: 'rider', title: 'Confirm a refund', sub: 'Buy-in dropped, Captain sent $5', run() { const t = T(); t.slots.nate.pay = 'confirmed'; t.refunds.push({ key: 'r1', id: 'nate', amount: 5, from: 20, to: 15, why: 'The buy-in dropped from $20 to $15.', sent: true, received: false }); } },
    { id: 'ready', role: 'captain', title: 'All green: ready to place', sub: 'Every leg in, paid and checked', run() {
      const t = T(); t.slots.simmy.pick = LEGS.celtics(); t.slots.nate.pick = LEGS.randle();
      t.slots.sam.pick = entry({ eventId: EV.jaxbal, marketKey: 'spreads', betTypeId: 'spread', participant: 'Jacksonville Jaguars', side: 'Jacksonville Jaguars', line: -10, price: -108, display: 'Spread -10' });
      t.riders.forEach(id => { t.slots[id].pay = 'confirmed'; });
    } },
    { id: 'profile', role: 'rider', title: 'Someone’s profile', sub: 'Tap any avatar', run() { G.sheet = { k: 'profile', v: 'mike' }; } },
    { id: 'soccer', role: 'rider', title: 'Soccer search', sub: 'Soccer tab · leagues · 3-way results', run() { startPick(false); PK().start({ screen: 'search' }); PK().S.sport = 'soccer'; PK().render(); return true; } },
    { id: 'placeslip', role: 'captain', title: 'Drop 2 · Upload the placed slip', sub: 'Match every leg, read the payout', run() { replayTicket('lost', 'ready'); act('slip-open', 'placed'); return true; } },
    { id: 'live', role: 'rider', title: 'Drop 2 · Following it live', sub: 'Real games mid-way (replay)', run() { replayTicket('lost', 'live'); refreshTrack(T(), true).then(render); return true; } },
    { id: 'lost', role: 'captain', title: 'Drop 2 · Lost, one leg missed', sub: 'Real Nov 8 results · the Bozo', run() { replayTicket('lost', 'final'); refreshTrack(T(), true).then(render); return true; } },
    { id: 'won', role: 'captain', title: 'Drop 2 · It hit! Confirm the payout', sub: 'Real Nov 8 results', run() { replayTicket('won', 'final'); refreshTrack(T(), true).then(render); return true; } },

    { id: 'chat', role: 'rider', title: 'The ticket chat', sub: 'Pinned to-dos + status lines', run() { G.tab = 'chat'; } },
    { id: 'me', role: 'rider', title: 'The Me tab', sub: 'Profile, stats, legs, money, group settings', run() { G.tab = 'me'; } },
    { id: 'newticket', role: 'captain', title: 'Start a new ticket', sub: 'Who’s in, buy-in, odds limits, handles', run() { act('new-ticket'); return true; } },
  ];
  function runMoment(id, keepView) {
    const m = MOMENTS.find(x => x.id === id); if (!m) return;
    G = freshState(); G.role = m.role; G.lastMoment = id; window.BOZO_ESPN_FIX = null; if (!keepView) G.view = 'phone';
    G.at = m.at || (id === 'fresh' ? (window.BOZO_START || 'group') : 'slip'); // moments open on the ticket; group-level ones say so
    const done = m.run();
    advance();
    if (!done) render();
  }

  // ---------- events
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-b]');
    if (!t || t.closest('#pick-root')) return;
    const stop = e.target.closest('[data-stop]');
    if (stop && stop !== t && t.contains(stop)) return; // clicks inside a sheet or a checklist don't trigger the thing behind them
    if (t.tagName === 'A') return;
    e.preventDefault();
    if (!t.disabled) act(t.dataset.b, t.dataset.v);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && G.sheet) act('close');
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.rcard')) { e.preventDefault(); act('open-card', e.target.dataset.v); }
  });

  window.BOZO = {
    onPickSaved, recentLookups, reuseLookup,
    conflictName(e) { const c = conflictFor(T(), me(), e); if (!c) return null; const w = c.with === me() ? 'your' : nm(c.with) + '’s'; return c.why === 'same bet' ? `Same as ${w} pick` : `Other side of ${w} pick`; },
    exitPick() { G.screen = 'room'; G.tab = 'ticket'; render(); },
    openSettings(msg) { if (G.screen === 'pick') { G.sheet = { k: 'keys', v: msg }; render(); } else { G.sheet = { k: 'keys', v: msg }; render(); } },
  };
  window.BOZO_APP = { get G() { return G; }, set G(v) { G = v; }, render, act, runMoment, MOMENTS, phoneInner, freshState, deadlineState, startPick, replayTicket, fillReplay, settle, advance, now, setOffset: o => { offset = o; }, getOffset: () => offset, LEGS, EV, ev, T };

  document.body.classList.add(window.BOZO_TAB || 'tabB'); // strip tab style (mock options A/B/C)
  rehKeysFromLink();
  if (PHONE) document.body.classList.add('phonemode');
  G = relink(((LIVE || REH) && loadLive()) || freshState()); if (LIVE) liveTick(); advance(); render();
  setInterval(() => {
    G.tickets.forEach(x => { if (x.placedAt && !x.settled && !G.replay && now() - (x.trackedAt || 0) > 60000) refreshTrack(x, x.id !== G.active); });
    const lv = liveTick(), ph = G.tickets.map(x => deadlineState(x).phase).join(), changed = advance() || lv || ph !== G.lastPhase; G.lastPhase = ph; tickCountdown();
    const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (changed && G.view === 'phone' && G.screen !== 'pick' && !typing) render();
  }, 15000);
  if (!PK().S.key && !REH) { G.sheet = { k: 'keys', v: 'Paste your Odds API key (and a Claude key for the AI backup) so the real pick flow can check DraftKings. Both stay in this browser.' }; render(); }
})();
